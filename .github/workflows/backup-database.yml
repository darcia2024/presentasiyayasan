name: Cadangan Basis Data PERISA

# PERISA AZHARIYAH — Fase 7: cadangan otomatis harian
#
# Supabase tier gratis TIDAK menyediakan cadangan harian otomatis (itu
# fitur tier Pro ke atas) — jadi kita jalankan sendiri lewat GitHub
# Actions, gratis, tanpa infrastruktur tambahan.
#
# ============================ AUDIT 10 Sep 2026 (M13) ======================
# TEMUAN: seluruh cadangan disimpan di bucket `backups-db` YANG BERADA DI
# PROJECT SUPABASE YANG SAMA dengan basis data yang dicadangkan. Kalau
# project itu terhapus, tersuspensi karena tagihan, atau akunnya diambil
# alih, cadangannya ikut hilang bersama aslinya. Cadangan yang hanya ada
# di dalam sistem yang dicadangkan bukan cadangan — itu salinan.
#
# PERBAIKANNYA: tujuan cadangan sekarang BISA LEBIH DARI SATU dan
# dikonfigurasi, bukan ditanam di kode:
#
#   1. supabase   — bucket backups-db (seperti sebelumnya). Cepat, tapi
#                   TIDAK memenuhi syarat "di luar sistem".
#   2. artifact   — artefak GitHub Actions, TERENKRIPSI. Ini penyimpanan
#                   di luar Supabase yang TIDAK BUTUH akun/kredensial
#                   pihak ketiga baru sama sekali, jadi bisa langsung
#                   dipakai. Retensi diatur GitHub (baku 90 hari).
#   3. s3         — penyimpanan apa pun yang bicara protokol S3 (Cloudflare
#                   R2, Backblaze B2, Wasabi, AWS S3). Mekanismenya sudah
#                   ada di bawah; yang belum: KREDENSIALNYA, karena memilih
#                   penyedia dan membuat akunnya adalah keputusan pemilik.
#
# Tujuan dipilih lewat repository variable BACKUP_DESTINATIONS, mis.
#   BACKUP_DESTINATIONS = supabase,artifact
# Baku (kalau variabelnya kosong): supabase,artifact.
#
# ENKRIPSI. Cadangan berisi nama, tanggal lahir, dan nomor WhatsApp
# keluarga sungguhan. Sebelum keluar dari Supabase, berkasnya dienkripsi
# dengan AES-256 memakai secret BACKUP_ENCRYPTION_PASSPHRASE. Kalau secret
# itu BELUM diisi, tujuan di luar Supabase DILEWATI dengan peringatan —
# bukan diunggah apa adanya. Gagal tertutup, sama seperti gerbang lain di
# proyek ini.
# ===========================================================================
#
# DUA JEBAKAN yang menggagalkan run pertama (5 Sep 2026, run #1) — keduanya
# sudah ditangani di bawah, dicatat di sini supaya tidak terulang:
#
#   1. VERSI. Server Supabase ini Postgres 17.6, sedangkan runner
#      ubuntu-latest memasang postgresql-client 16 lewat apt biasa.
#      pg_dump MENOLAK men-dump server yang lebih baru dari dirinya.
#      Karena itu klien 17 dipasang dari repo PGDG.
#
#   2. MODE POOLER. Port 6543 adalah pooler mode TRANSAKSI: state sesi
#      tidak dipertahankan antar perintah, sedangkan pg_dump butuh itu.
#      Port 5432 di host yang sama adalah mode SESI. Langkah dump
#      menormalkan port ini sendiri.
#
# AGAR JALAN — tiga secret (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL           connection string pooler MODE SESI (port 5432)
#   SUPABASE_URL              https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY kunci service_role (BUKAN anon)
# Ditambah satu yang SANGAT DIANJURKAN:
#   BACKUP_ENCRYPTION_PASSPHRASE  frasa sandi panjang & acak. SIMPAN JUGA
#                                 DI LUAR GITHUB — tanpa frasa ini
#                                 cadangannya tidak bisa dibuka lagi.
#
# PEMULIHAN — lihat docs/pemulihan-bencana.md.

on:
  schedule:
    # 18:00 UTC = 01:00 WIB — jam sepi, jauh dari jam belajar santri.
    - cron: '0 18 * * *'
  workflow_dispatch: {}

concurrency:
  group: cadangan-basis-data
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # apt bawaan Ubuntu hanya sampai klien 16; server kita 17. Repo PGDG
      # resmi menyediakan klien 17 untuk rilis Ubuntu apa pun yang dipakai
      # runner, jadi langkah ini tidak ikut rusak saat image runner naik versi.
      - name: Pasang klien PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/pgdg.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "Klien terpasang: $(pg_dump --version)"

      - name: Buat cadangan (pg_dump, format custom)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          # Lihat jebakan #2 di kepala berkas: pg_dump tidak bisa lewat pooler
          # mode transaksi. Dialihkan di sini, bukan dengan menyuruh pemilik
          # repo menempel ulang secret — supaya tidak ada langkah manual yang
          # bisa terlewat saat kredensial dirotasi nanti.
          DB_URL="$SUPABASE_DB_URL"
          case "$DB_URL" in
            *:6543/*)
              DB_URL="${DB_URL/:6543\//:5432/}"
              echo "::add-mask::$DB_URL"
              echo "Pooler mode transaksi (6543) dialihkan ke mode sesi (5432) untuk pg_dump."
              ;;
          esac

          echo "Versi klien : $(pg_dump --version | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          echo "Versi server: $(psql "$DB_URL" -tAc 'show server_version' 2>/dev/null || echo '(tidak terbaca)')"

          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          FILENAME="perisa-backup-${TIMESTAMP}.dump"
          pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --file="$FILENAME"

          # pg_dump bisa keluar dengan kode 0 tapi menulis berkas nyaris kosong
          # kalau koneksinya putus di tengah. Cadangan yang diam-diam kosong
          # lebih berbahaya daripada cadangan yang gagal terang-terangan.
          UKURAN=$(stat -c %s "$FILENAME")
          if [ "$UKURAN" -lt 4096 ]; then
            echo "::error::Cadangan mencurigakan: hanya ${UKURAN} byte — dianggap gagal."
            exit 1
          fi

          # Verifikasi isi: pg_restore harus bisa membaca daftar objeknya,
          # DAN daftar itu harus memuat tabel-tabel inti. Berkas yang
          # strukturnya utuh tapi isinya bukan basis data kita tetap gagal.
          pg_restore --list "$FILENAME" > /tmp/daftar-objek.txt
          for TABEL in wali santri modul xp_log sertifikat; do
            if ! grep -q "TABLE DATA public $TABEL" /tmp/daftar-objek.txt; then
              echo "::error::Cadangan tidak memuat tabel '$TABEL' — isinya tidak utuh."
              exit 1
            fi
          done
          echo "Verifikasi isi: 5 tabel inti ditemukan di dalam cadangan."

          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "UKURAN=$UKURAN" >> "$GITHUB_ENV"
          echo "Ukuran cadangan: $(du -h "$FILENAME" | cut -f1) (${UKURAN} byte)."

      - name: Enkripsi cadangan (untuk tujuan di luar Supabase)
        id: enkripsi
        env:
          FRASA: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${FRASA:-}" ]; then
            echo "::warning::BACKUP_ENCRYPTION_PASSPHRASE belum diisi. Cadangan TIDAK akan dikirim ke tujuan di luar Supabase — data keluarga sungguhan tidak diunggah tanpa enkripsi."
            echo "siap=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # AES-256-CBC + PBKDF2. openssl selalu ada di runner ubuntu-latest,
          # jadi tidak ada alat tambahan yang perlu dipasang — dan membuka
          # kembali cadangannya cuma butuh openssl, yang ada di mana-mana:
          #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
          #     -in berkas.dump.enc -out berkas.dump -pass env:FRASA
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$FILENAME" -out "${FILENAME}.enc" -pass env:FRASA
          echo "Terenkripsi: ${FILENAME}.enc ($(du -h "${FILENAME}.enc" | cut -f1))"
          echo "siap=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------- TUJUAN 1: SUPABASE
      - name: Unggah ke Supabase Storage (bucket privat backups-db)
        if: contains(vars.BACKUP_DESTINATIONS || 'supabase,artifact', 'supabase')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -s -o /tmp/upload-response.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/storage/v1/object/backups-db/$FILENAME" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$FILENAME")
          cat /tmp/upload-response.json
          if [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Unggah cadangan ke Supabase gagal (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Cadangan tersimpan: backups-db/$FILENAME"

      # ------------------------------------------------- TUJUAN 2: ARTEFAK
      # Penyimpanan DI LUAR Supabase yang tidak butuh akun pihak ketiga.
      - name: Simpan sebagai artefak GitHub (terenkripsi)
        if: >-
          steps.enkripsi.outputs.siap == 'true' &&
          contains(vars.BACKUP_DESTINATIONS || 'supabase,artifact', 'artifact')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}.enc
          path: ${{ env.FILENAME }}.enc
          retention-days: ${{ vars.BACKUP_ARTIFACT_RETENTION_DAYS || 90 }}
          if-no-files-found: error

      # ------------------------------------------------- TUJUAN 3: S3 (opsional)
      # Mekanismenya lengkap; yang belum ada hanyalah kredensialnya, karena
      # memilih penyedia adalah keputusan pemilik. Selama secret-nya kosong,
      # langkah ini tidak pernah berjalan dan tidak menggagalkan apa pun.
      - name: Unggah ke penyimpanan S3-kompatibel (opsional)
        if: >-
          steps.enkripsi.outputs.siap == 'true' &&
          contains(vars.BACKUP_DESTINATIONS || 'supabase,artifact', 's3')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'auto' }}
          S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          KURANG=""
          [ -z "${AWS_ACCESS_KEY_ID:-}" ] && KURANG="$KURANG BACKUP_S3_ACCESS_KEY_ID"
          [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] && KURANG="$KURANG BACKUP_S3_SECRET_ACCESS_KEY"
          [ -z "${S3_BUCKET:-}" ] && KURANG="$KURANG BACKUP_S3_BUCKET"
          if [ -n "$KURANG" ]; then
            echo "::error::Tujuan 's3' diminta tapi konfigurasinya belum lengkap:$KURANG"
            exit 1
          fi
          ARGS=""
          [ -n "${S3_ENDPOINT:-}" ] && ARGS="--endpoint-url $S3_ENDPOINT"
          aws s3 cp "${FILENAME}.enc" "s3://${S3_BUCKET}/perisa/${FILENAME}.enc" $ARGS
          echo "Cadangan tersimpan di s3://${S3_BUCKET}/perisa/${FILENAME}.enc"

      # ------------------------------------------------------------ RETENSI
      - name: Hapus cadangan Supabase lebih dari 14 hari
        if: contains(vars.BACKUP_DESTINATIONS || 'supabase,artifact', 'supabase')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HARI_SIMPAN: ${{ vars.BACKUP_SUPABASE_RETENTION_DAYS || 14 }}
        run: |
          node --input-type=module -e '
            const url = process.env.SUPABASE_URL;
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
            const hari = Number(process.env.HARI_SIMPAN || 14);
            const headers = { apikey: key, Authorization: `Bearer ${key}`, "Content-Type": "application/json" };

            const res = await fetch(`${url}/storage/v1/object/list/backups-db`, {
              method: "POST",
              headers,
              body: JSON.stringify({ prefix: "", limit: 1000, sortBy: { column: "name", order: "asc" } }),
            });
            const objek = await res.json();
            if (!Array.isArray(objek)) { console.error("Gagal daftar objek:", objek); process.exit(1); }

            const batasWaktu = Date.now() - hari * 24 * 60 * 60 * 1000;
            const kadaluwarsa = objek.filter((o) => new Date(o.created_at).getTime() < batasWaktu).map((o) => o.name);

            // Jangan pernah menghapus SEMUANYA. Kalau seluruh isi bucket
            // terhitung kedaluwarsa, itu tanda ada yang salah (jam server,
            // cadangan berhenti berjalan berminggu-minggu) — dan menghapus
            // satu-satunya cadangan yang tersisa adalah cara terburuk untuk
            // mengetahuinya.
            if (kadaluwarsa.length && kadaluwarsa.length === objek.length) {
              console.error("::error::SELURUH cadangan terhitung kedaluwarsa. Tidak ada yang dihapus — periksa apakah cadangan harian masih berjalan.");
              process.exit(1);
            }

            if (!kadaluwarsa.length) { console.log("Tidak ada cadangan kedaluwarsa."); process.exit(0); }

            const hapus = await fetch(`${url}/storage/v1/object/backups-db`, {
              method: "DELETE",
              headers,
              body: JSON.stringify({ prefixes: kadaluwarsa }),
            });
            console.log(`Dihapus ${kadaluwarsa.length} cadangan lama:`, kadaluwarsa, "->", hapus.status);
          '

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "### Cadangan basis data PERISA"
            echo ""
            echo "| Hal | Nilai |"
            echo "|---|---|"
            echo "| Berkas | \`${FILENAME:-(gagal sebelum dibuat)}\` |"
            echo "| Ukuran | ${UKURAN:-0} byte |"
            echo "| Tujuan | ${{ vars.BACKUP_DESTINATIONS || 'supabase,artifact' }} |"
            echo "| Terenkripsi | ${{ steps.enkripsi.outputs.siap == 'true' && 'ya' || 'TIDAK — passphrase belum diisi' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
