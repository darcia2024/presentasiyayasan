# ============================================================================
# PERISA AZHARIYAH — Konfigurasi Supabase CLI
#
# KENAPA BERKAS INI BARU ADA SEKARANG (audit 10 September 2026).
# Sampai audit ini, tidak ada config.toml sama sekali. Artinya setelan
# penting seperti "fungsi mana yang boleh dipanggil TANPA login" hanya
# hidup sebagai bendera baris perintah yang diketik manual saat men-deploy
# — tidak tercatat di mana pun, tidak bisa ditinjau, dan hilang begitu
# orang yang mengetiknya lupa. Uji asap membuktikan auth-otp-request
# memang bisa dipanggil tanpa Authorization, tapi tidak ada satu berkas
# pun di repo yang menyatakan itu memang disengaja.
#
# Sekarang setelan itu ADA DI REPO: `supabase functions deploy` membacanya
# sendiri, jadi hasil deploy sama siapa pun yang menjalankannya.
#
# project_id SENGAJA TIDAK ditulis di sini. Jalankan `supabase link` sekali
# di mesin masing-masing (ref proyek tersimpan di supabase/.temp/, yang
# sudah diabaikan git).
# ============================================================================

# ---------------------------------------------------------------- FUNGSI
#
# verify_jwt = true (BAKU, tidak perlu ditulis) berarti gerbang Supabase
# menolak permintaan tanpa JWT yang sah SEBELUM kode kita berjalan.
# Sesi PERISA ditandatangani dengan APP_JWT_SECRET — yaitu JWT Secret
# proyek Supabase itu sendiri (lihat .env.example), jadi token sesi kita
# lolos gerbang bawaan itu apa adanya.
#
# Dua fungsi di bawah TIDAK BISA memakai gerbang itu, dan masing-masing
# punya gerbangnya sendiri:

# Inilah yang MENERBITKAN sesi — dipanggil sebelum ada sesi apa pun, jadi
# memang tidak mungkin membawa JWT. Gerbangnya: nomor harus terdaftar DAN
# PIN-nya cocok, maksimal 5 percobaan sebelum akun dikunci 15 menit.
#
# Menggantikan auth-otp-request + auth-otp-verify (dihapus 12 Sep 2026,
# lihat migrasi 20260912000001_login_pin.sql).
[functions.auth-login-pin]
verify_jwt = false

# Dipicu penjadwal (GitHub Actions), bukan peramban — tidak ada sesi
# pengguna yang bisa dibawa. Gerbangnya: header X-Cron-Secret harus
# cocok dengan env CRON_SECRET. Lihat .github/workflows/ringkasan-mingguan.yml.
[functions.kirim-ringkasan-mingguan]
verify_jwt = false

# Sisanya (kuis-soal, submit-jawaban, video-signed-url,
# terbitkan-sertifikat, daftarkan-wali-santri, auth-atur-pin) memakai verify_jwt baku
# = true, LALU memverifikasi ulang sesinya sendiri lewat
# _shared/sesi.ts untuk tahu SIAPA pemanggilnya — bukan cuma "sudah login".
