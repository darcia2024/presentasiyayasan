<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10271F">
  <title>Mode Luring — PERISA Azhariyah</title>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* Warna & huruf judul dari tokens.css (precache app shell). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px 26px calc(32px + env(safe-area-inset-bottom));
      text-align: center;
      background: var(--permukaan-halaman);
      color: var(--teks-utama);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    img { width: 96px; height: 96px; object-fit: contain; }
    h1 { font-family: var(--font-judul); font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -0.02em; }
    p { font-size: 14px; line-height: 1.65; color: var(--teks-isi); max-width: 330px; }
    .chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--permukaan-redup);
      border: 1px solid var(--garis);
      color: var(--teks-isi);
      padding: 5px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emas); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.72); } }
    button {
      margin-top: 6px;
      background: var(--aksen); color: var(--teks-terbalik);
      border: none; border-radius: 999px;
      padding: 14px 30px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer;
      min-height: 48px;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: var(--aksen-hover); }
    button:active { transform: scale(0.96); }
    small { font-size: 11.5px; color: var(--teks-redup); }
  </style>
</head>
<body>
  <img src="icons/icon-192.png" alt="PERISA Azhariyah">
  <span class="chip"><span class="dot"></span> Mode Luring</span>
  <h1>Sambungan Terputus</h1>
  <p>
    Perangkat sedang tidak tersambung ke internet. Materi yang sudah pernah dibuka
    tetap tersimpan di aplikasi dan bisa diakses kembali setelah jaringan pulih.
  </p>
  <button id="tombolSambungUlang">Coba Sambungkan Ulang</button>
  <small>Yayasan Peradaban Islam Azhariyah — Asuhan Umi Elly</small>

  <script src="js/offline.js"></script>
</body>
</html>
